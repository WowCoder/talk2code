# Eval 任务集 —— 31 个固定需求，从简单到复杂
# 每个任务包含 id / name / requirement（用户原话）/ 断言列表。
# 断言类型：
#   file_exists:        指定文件存在
#   content_contains:   某文件包含某字符串（大小写敏感）
#   content_not_contains: 某文件不含某字符串（反模式：innerHTML/eval 等）
#   html_has_element:   index.html 包含某 CSS 选择器对应的元素
#   preview_no_error:   Playwright 运行 index.html 无 pageerror/console.error
#   file_min_lines:     某文件行数 ≥ N（防偷懒空文件）
#
# 难度分级：L1 单页静态(8) / L2 交互+本地存储(10) / L3 复杂多状态+回归专项(9) / L4 综合(4)
# 编号约定：t01..t21 为第一批（按难度递增，t21 为回归专项、归入 L3）；
#           t22..t31 为第二批扩展（补齐表格 / 响应式 / 拖拽 / 图表 / 复杂表单等场景），
#           追加在文件末尾，不重排既有编号 —— 历史基线与 run 目录都按 id 引用。

tasks:
  # ===== L1: 单页静态展示（5）=====
  - id: t01
    name: 个人名片页
    level: 1
    requirement: "做一个个人名片页面，显示姓名、职位、一句话简介，背景用渐变色"
    assertions:
      - {type: file_exists, filename: index.html}
      # min 原为 20：一个「标题 + 职位 + 一句话简介」的完整名片页，写实了就是
      # 17 行（doctype/head/link/body/卡片/h1/p/p），20 会把它当成偷懒空文件误杀。
      # 12 行仍远高于任何真实空壳（空壳 < 5 行），保留「防空文件」的本意。
      # 2026-10-07 实测：页面完整、preview 零错误、渐变命中，唯一失败项就是这条。
      - {type: file_min_lines, filename: index.html, min: 12}
      - {type: content_contains, filename: style.css, text: "gradient"}
      - {type: preview_no_error}

  - id: t02
    name: 产品着陆页
    level: 1
    requirement: "做一个 SaaS 产品着陆页，包含 hero 区、三个特性卡片、底部 CTA 按钮"
    assertions:
      - {type: file_exists, filename: index.html}
      # 「CTA 按钮」在着陆页里更常见的写法是 `<a class="btn" href="#cta">`（语义
      # 上比 <button> 更对：它是跳转不是提交）。只认字面 <button> 会误杀合格产物，
      # 所以这里用并集：真按钮 / 类名含 btn / 类名含 button 任一命中即可。
      - {type: html_has_element, selector: "button, [class*=btn], [class*=button]"}
      - {type: content_not_contains, filename: index.html, text: "lorem ipsum"}
      - {type: preview_no_error}

  - id: t03
    name: 文章排版页
    level: 1
    requirement: "做一个博客文章页面，有标题、正文段落、引用块、作者信息"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "blockquote"}
      - {type: preview_no_error}

  - id: t04
    name: 定价表
    level: 1
    requirement: "做一个定价对比表，三个套餐（基础/专业/企业），中间套餐高亮，每个有价格和功能列表"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "ul"}
      - {type: preview_no_error}

  - id: t05
    name: 图片画廊
    level: 1
    requirement: "做一个响应式图片画廊，3 列网格，hover 时图片放大"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: style.css, text: "hover"}
      - {type: preview_no_error}

  # ===== L2: 交互 + localStorage（7）=====
  - id: t06
    name: 待办清单
    level: 2
    requirement: "做一个待办清单应用，可以添加、勾选完成、删除任务，用 localStorage 持久化"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: content_not_contains, filename: script.js, text: "eval"}
      - {type: content_not_contains, filename: script.js, text: "innerHTML"}
      - {type: preview_no_error}

  - id: t07
    name: 计数器
    level: 2
    requirement: "做一个计数器应用，有加、减、重置按钮，数字实时更新，localStorage 保存当前值"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "button"}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t08
    name: 简单计算器
    level: 2
    requirement: "做一个简单计算器，支持加减乘除，有数字按钮和运算符按钮，显示计算结果"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: preview_no_error}

  - id: t09
    name: 颜色选择器
    level: 2
    requirement: "做一个颜色选择器，拖动 RGB 三个滑块实时预览颜色，显示十六进制色值"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "input"}
      - {type: preview_no_error}

  - id: t10
    name: 留言板
    level: 2
    requirement: "做一个留言板，输入昵称和留言内容后提交，留言列表显示在下方，用 localStorage 保存"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t11
    name: 标签页切换
    level: 2
    requirement: "做一个标签页（Tab）切换组件，三个标签对应三块内容，点击标签切换显示"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: preview_no_error}

  - id: t12
    name: 番茄钟
    level: 2
    requirement: "做一个番茄钟计时器，25 分钟倒计时，开始/暂停按钮，倒计时结束提示"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: preview_no_error}

  # ===== L3: 复杂多状态（5）=====
  - id: t13
    name: 购物车
    level: 3
    requirement: "做一个购物车，有商品列表（3个商品带图片占位），可增减数量，实时计算总价，localStorage 保存"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t14
    name: 天气展示卡
    level: 3
    requirement: "做一个天气展示卡片，切换城市显示不同天气（预设数据），有图标、温度、湿度、风速"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: preview_no_error}

  - id: t15
    name: 表单验证
    level: 3
    requirement: "做一个注册表单，含邮箱、密码、确认密码字段，实时验证格式，错误提示显示在输入框下方"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "email"}
      - {type: preview_no_error}

  - id: t16
    name: 排序可视化
    level: 3
    requirement: "做一个数组排序可视化，生成随机数字柱状图，点击按钮逐步执行冒泡排序，每步高亮交换的柱子"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "button"}
      - {type: preview_no_error}

  - id: t17
    name: 搜索过滤列表
    level: 3
    requirement: "做一个可搜索的产品列表，输入框实时过滤产品名称，无结果时显示空状态提示"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "input"}
      - {type: preview_no_error}

  # ===== L4: 综合（3）=====
  - id: t18
    name: 个人仪表盘
    level: 4
    requirement: "做一个个人仪表盘，顶部导航栏，左侧侧边栏菜单，主区域显示欢迎卡片和今日任务列表，深色主题"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: file_min_lines, filename: index.html, min: 50}
      - {type: preview_no_error}

  - id: t19
    name: 笔记应用
    level: 4
    requirement: "做一个笔记应用，左侧笔记列表，右侧编辑区，新建/删除笔记，内容实时保存到 localStorage"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t20
    name: 看板
    level: 4
    requirement: "做一个看板（Kanban）板，三列（待办/进行中/已完成），可以添加任务卡片到各列，localStorage 持久化"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  # ===== 回归专项：需求 #110-116 七连败失败模式固化 =====
  # 同一需求连续 7 次 finished_with_issues（2026-08-18），失败模式：
  # ES module CORS 全灭 / CDN 依赖 / ERR_FILE_NOT_FOUND / 遮罩层 hidden /
  # 点击即死。本组断言在写入时刻即可判定，防止同类缺陷再次漏网。
  - id: t21
    name: 贪吃蛇七连败回归
    level: 3
    requirement: "创建一个 贪吃蛇 小游戏，要求有排行榜功能，可以分享，画风要Q一点"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "canvas"}
      # ENV-3：file:// 下 ES Module 被 CORS 拦截（#115 直接死因）
      - {type: content_not_contains, filename: index.html, text: "type=\"module\""}
      # ENV-2：无网络沙箱，CDN 必挂（#110-116 多次踩坑）
      - {type: content_not_contains, filename: index.html, text: "cdn.tailwindcss.com"}
      - {type: preview_no_error}

  # ===== 第二批扩展（t22..t31）=====
  # 补齐第一批没覆盖的产物形态：数据表格 / 团队页 / 动效落地页 / 单位换算 /
  # 生成式表单 / 评分组件 / 拖拽 / 响应式导航 / 图表 / 双栏聊天。
  # 断言口径与第一批一致：只卡「产物是否成立」，同一个语义有多种合法写法时
  # 用逗号并集，不逼模型猜我们心里的那一种；运行期错误一律走 preview_no_error。

  - id: t22
    name: 产品参数对比表
    level: 1
    requirement: "做一个三款手机的参数对比表，列是型号，行是价格、屏幕、电池、重量，窄屏时表格可以横向滚动"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "table"}
      - {type: preview_no_error}

  - id: t23
    name: 团队介绍页
    level: 1
    requirement: "做一个团队成员介绍页，四个成员卡片（头像占位、姓名、职位、社交链接），两列网格布局"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "a"}
      - {type: preview_no_error}

  - id: t24
    name: 活动报名落地页
    level: 1
    requirement: "做一个活动报名落地页，顶部标题有淡入动画，中间三个亮点，底部报名按钮，整体浅色渐变背景"
    assertions:
      - {type: file_exists, filename: index.html}
      # 「报名按钮」可能是 <button>，也可能是 <a class="btn">（跳转语义更常见）
      - {type: html_has_element, selector: "button, [class*=btn]"}
      - {type: preview_no_error}

  - id: t25
    name: 单位换算器
    level: 2
    requirement: "做一个单位换算器，长度（米/厘米/英寸）和重量（千克/克/磅）两组单位，选好单位后输入数字实时换算"
    assertions:
      - {type: file_exists, filename: index.html}
      # 单位选择既可能用 <select>，也可能用一排按钮 —— 两者都算合法
      - {type: html_has_element, selector: "select, input"}
      - {type: preview_no_error}

  - id: t26
    name: 密码生成器
    level: 2
    requirement: "做一个随机密码生成器，可以调长度（8 到 32 位），勾选是否包含大写、数字、符号，点按钮生成并显示密码强度"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: html_has_element, selector: "input"}
      - {type: preview_no_error}

  - id: t27
    name: 五星评分组件
    level: 2
    requirement: "做一个五星评分组件，鼠标移到星星上预览分数，点击提交评分，刷新后显示上次的评分"
    assertions:
      - {type: file_exists, filename: index.html}
      # 星星可以是 ★ 文本、<span>、<button>、内联 SVG，也可以由 JS 动态渲染到
      # 一个容器里（2026-10-19 实测：产物把五星渲染进 <div class="stars">，
      # 静态 HTML 里没有 span/button/svg —— 只认标签又会误杀合格写法）。
      - {type: html_has_element, selector: "span, button, svg, [class*=star], [class*=rating]"}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t28
    name: 拖拽排序待办
    level: 3
    requirement: "做一个可拖拽排序的待办列表，拖动调整顺序，顺序保存在 localStorage，刷新后顺序不变"
    assertions:
      - {type: file_exists, filename: index.html}
      # 用子串 "drag" 而不是字面 "dragstart"：draggable / ondragstart / dragenter 都命中
      - {type: content_contains, filename: script.js, text: "drag"}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: preview_no_error}

  - id: t29
    name: 响应式导航栏
    level: 3
    requirement: "做一个响应式顶部导航栏，宽屏横向排列菜单，窄屏折叠成汉堡按钮，点击展开或收起菜单"
    assertions:
      - {type: file_exists, filename: index.html}
      # 语义标签与 class 命名两种写法都接受（nav / navbar / menu）
      - {type: html_has_element, selector: "nav, [class*=nav], [class*=menu]"}
      - {type: preview_no_error}

  - id: t30
    name: 月度销售柱状图
    level: 3
    requirement: "做一个月度销售柱状图，用 SVG 或 Canvas 画 6 根柱子，鼠标悬停显示当月数值，带坐标轴和月份标签"
    assertions:
      - {type: file_exists, filename: index.html}
      # 不静态断言 <svg>/<canvas>：2026-10-19 实测产物把 SVG 用
      # document.createElementNS 动态插进 #chart-container，静态 HTML 里只有
      # 一个空 section —— 只认标签会把「运行后才出生的图表」误杀。
      # 图表能否真正渲染交给 preview_no_error（运行时无异常）兜底。
      - {type: preview_no_error}

  - id: t31
    name: 双栏聊天界面
    level: 4
    requirement: "做一个聊天界面，左侧会话列表，右侧消息气泡区分自己和对方，底部输入框回车发送，消息保存到 localStorage"
    assertions:
      - {type: file_exists, filename: index.html}
      - {type: file_min_lines, filename: index.html, min: 40}
      - {type: content_contains, filename: script.js, text: "localStorage"}
      - {type: html_has_element, selector: "input"}
      - {type: preview_no_error}
