# Talk2Code 生产 Nginx 配置
# 安装: 复制到 /etc/nginx/sites-available/talk2code 后
#       ln -sf /etc/nginx/sites-available/talk2code /etc/nginx/sites-enabled/talk2code
#       nginx -t && systemctl reload nginx
#
# 本文件含两个 server 块：
#   1) 主站 <DOMAIN>
#   2) 已发布站点 *.<APEX>（「一键发布」产物，需要泛域名证书）
#
# 把 <DOMAIN> / <APEX> / <APEX_REGEX> 替换为实际域名：
#   <APEX_REGEX> 是转义了点号的 apex，例如 example\.com
# 部署后跑 certbot 补全 443 与 HTTP→HTTPS 重定向，见 docs/deploy.md。
#
# ⚠️ server_name 必须同时列出 www：certbot 申请多域名证书时（-d a.com -d www.a.com），
#    只要有一个域名在配置里找不到匹配的 server_name，它会判定安装失败并**回滚整个
#    443 部署**（证书仍然签下来了，但 nginx 配置不动）。

# ==================== 主站 ====================
server {
    listen 80;
    server_name <DOMAIN>;

    client_max_body_size 50m;

    # 安全响应头。静态产物由本层直接托管、不经过 Flask，因此必须在这里补齐。
    # ⚠️ nginx 的 add_header 不被子块继承：子块一旦出现 add_header，这里的全部失效，
    #    所以下方带 add_header 的 location 里都重复声明了一遍。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态产物
    location / {
        root /opt/talk2code/frontend-vue/dist;
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        root /opt/talk2code/frontend-vue/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 后端 API + SSE 长连接
    # proxy_buffering off 是 SSE 的硬要求，否则流式输出被攒住、实时效果全无
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：配合后端 TRUST_PROXY_HEADERS=true 得到不可伪造的客户端 IP。
        # 若改用 $proxy_add_x_forwarded_for，最左段由客户端自带，限流可被伪造绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# ==================== 已发布站点（一键发布） ====================
# 前置条件：
#   1) DNS: *.<APEX> 泛解析指向本机
#   2) 泛域名证书（云厂商免费证书通常不含通配符，用 acme.sh 走 DNS 验证申请）
# 不配这一块，「一键发布」返回的 <slug>.<APEX> 链接将无法访问。
server {
    listen 80;
    server_name ~^[a-z0-9]+\.<APEX_REGEX>$;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 22.04 自带 nginx 1.18，不支持新版 "http2 on;" 写法
    listen 443 ssl http2;
    server_name ~^[a-z0-9]+\.<APEX_REGEX>$;

    ssl_certificate     /etc/letsencrypt/live/<APEX>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<APEX>/privkey.pem;

    # 发布站跑的是用户生成的代码，禁止被任何站点 iframe 嵌套
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
