# Talk2Code 生产 Nginx 配置
# 安装: 复制到 /etc/nginx/sites-available/talk2code 后
#       ln -sf /etc/nginx/sites-available/talk2code /etc/nginx/sites-enabled/talk2code
#       nginx -t && systemctl restart nginx
#
# 本文件含三个 server 组：
#   1) 主站 <DOMAIN>（certbot 会在本文件里追加 :443 块）
#   2) www.<DOMAIN> → 主站的 301（见下方说明）
#   3) 已发布站点 *.<APEX>（「一键发布」产物，需要泛域名证书）
#
# 全局调优（open_file_cache、带 $request_time 的日志格式）见同目录 nginx-tuning.conf，
# 它装到 /etc/nginx/conf.d/ 下 —— 那些是 http 级指令，放不进 server 块。
#
# 把 <DOMAIN> / <APEX> / <APEX_REGEX> 替换为实际域名：
#   <APEX_REGEX> 是转义了点号的 apex，例如 example\.com
# 部署后跑 certbot 补全 443 与 HTTP→HTTPS 重定向，见 docs/deploy.md。
#
# ⚠️ server_name 必须同时覆盖 www：certbot 申请多域名证书时（-d a.com -d www.a.com），
#    只要有一个域名在配置里找不到匹配的 server_name，它会判定安装失败并**回滚整个
#    443 部署**（证书仍然签下来了，但 nginx 配置不动）。

# ==================== 主站 ====================
server {
    listen 80;
    server_name <DOMAIN>;

    client_max_body_size 50m;

    # 带耗时的日志格式（定义在 conf.d/talk2code-tuning.conf）。
    # 默认 combined 格式没有任何时间字段，事后无法区分「服务端慢」与「用户网络慢」。
    access_log /var/log/nginx/access.log talk2code_timed;

    # 安全响应头。静态产物由本层直接托管、不经过 Flask，因此必须在这里补齐。
    # ⚠️ nginx 的 add_header 不被子块继承：子块一旦出现 add_header，这里的全部失效，
    #    所以下方带 add_header 的 location 里都重复声明了一遍。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 前端静态产物
    location / {
        root /opt/talk2code/frontend-vue/dist;
        try_files $uri $uri/ /index.html;
    }

    # SPA 入口必须每次回源校验：它引用的是带 hash 的产物文件名，一旦被浏览器
    # 启发式缓存，重新部署后用户会拿着旧 HTML 去请求已被删除的旧 hash 文件 ——
    # 白屏，且不强刷无法自愈。
    location = /index.html {
        root /opt/talk2code/frontend-vue/dist;
        # ★ 必须关掉全局的 open_file_cache（见 conf.d/talk2code-tuning.conf）。
        #   它会把文件的 stat 与**打开的文件描述符**缓存住；而 index.html 是本站
        #   唯一「文件名不变、内容会变」的文件 —— 每次构建都会换成新 inode，
        #   缓存里的旧 fd 仍指向旧 inode，于是部署后 nginx 继续下发**旧 HTML**，
        #   里面引用的还是已被删除的旧 hash 资源 → 整站白屏，直到缓存条目过期
        #   （inactive 60s / valid 120s）。实测踩过：响应头 last-modified 停在上一版。
        #   其余文件都不受影响：/assets/ 与 /fonts/ 的名字里带 hash，内容即身份。
        open_file_cache off;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # favicon 落在 location / 里不会带任何缓存头，每次访问都要条件请求
    location = /favicon.png {
        root /opt/talk2code/frontend-vue/dist;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 带 hash 的构建产物：文件名即内容指纹，可长缓存
    location /assets/ {
        root /opt/talk2code/frontend-vue/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 自托管字体（public/fonts/）。必须单独开 location，三个原因：
    #   ① 文件名里带 Google 的字体版本 hash，内容即身份，可长缓存（与 /assets/ 同策略）；
    #   ② nginx 自带的 mime.types **没有 woff2**（只有 application/font-woff woff），
    #      不显式声明就会下发成 application/octet-stream；
    #   ③ 落进 location / 的话，文件缺失会命中 try_files 回落到 index.html ——
    #      浏览器拿到 HTTP 200 + text/html，字体静默失效，排查时毫无线索。
    location /fonts/ {
        root /opt/talk2code/frontend-vue/dist;
        types {
            font/woff2 woff2;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 后端 API + SSE 长连接
    # proxy_buffering off 是 SSE 的硬要求，否则流式输出被攒住、实时效果全无
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：配合后端 TRUST_PROXY_HEADERS=true 得到不可伪造的客户端 IP。
        # 若改用 $proxy_add_x_forwarded_for，最左段由客户端自带，限流可被伪造绕过。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ★ 主站的 443 块由 certbot 追加，它写的是 `listen 443 ssl;`（不带 http2）。
    #   nginx 的 http2 是 **listen socket 级**参数：目前是靠下面发布站块的
    #   `listen 443 ssl http2;` 顺带把同一个 socket 打开了，所以主站事实上走 HTTP/2。
    #   后果：发布站块一旦被裁掉（泛域名证书缺失时 deploy.sh 会裁），主站会**静默
    #   掉回 HTTP/1.1** —— 每域名只有 6 条并发连接，一页十几个静态资源会排队。
    #   deploy.sh 里有一步幂等 sed 给主站这行补 http2，并有一步实测协议版本。
}

# ==================== www → 主站 301 ====================
# www 不跳的话，<DOMAIN> 与 www.<DOMAIN> 是两份各自返回 200 的同内容站点：
# 浏览器缓存分裂、搜索引擎当两个站收录。统一 301 到 apex。
#
# 两半都在这里；https 那半被一对标记括住，deploy.sh 会在 apex 证书尚未签发时
# 整段删掉 —— 否则首次部署 nginx -t 加载不到证书会直接失败、连主站都起不来。
# 签完证书重跑本脚本，这段会自动加回。
#
# ⚠️ 重定向必须写在 `location /` 里，不能用 server 级 `return`：server 级 return
#    在 rewrite 阶段执行、先于 location 匹配，会把 certbot 续期时要访问的
#    /.well-known/acme-challenge/ 一并 301 掉 → 续期失败。
#    也不要自己声明 ACME location：续期由 certbot 的 nginx 插件负责插入，
#    预先占位会让它报重复 location 而中断续期。
server {
    listen 80;
    server_name www.<DOMAIN>;

    location / {
        return 301 https://<DOMAIN>$request_uri;
    }
}

# >>> www-https-start（需 apex 证书，未签发时由 deploy.sh 整段删除）
server {
    listen 443 ssl http2;
    server_name www.<DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://<DOMAIN>$request_uri;
    }
}
# <<< www-https-end

# ==================== 已发布站点（一键发布） ====================
# 前置条件：
#   1) DNS: *.<APEX> 泛解析指向本机
#   2) 泛域名证书。通配符**不支持 HTTP 验证**，必须走 DNS-01：
#        certbot certonly --manual --preferred-challenges dns \
#          --cert-name wildcard.<APEX> -d '*.<APEX>'
#      （把 ACME 给出的 TXT 值加到 _acme-challenge.<APEX>，签完可删）
# 不配这一块，「一键发布」返回的 <slug>.<APEX> 链接将无法访问。
server {
    listen 80;
    server_name "~^[a-z0-9]{20}\.<APEX_REGEX>$";
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 22.04 自带 nginx 1.18，不支持新版 "http2 on;" 写法
    listen 443 ssl http2;
    server_name "~^[a-z0-9]{20}\.<APEX_REGEX>$";

    # 泛域名证书。单独一张（certbot certonly --manual --preferred-challenges dns \
    #   --cert-name wildcard.<APEX> -d '*.<APEX>'）→ /etc/letsencrypt/live/wildcard.<APEX>/。
    #   刻意不 --expand 进主站那张：通配符**不覆盖 apex**，主站仍需自己的
    #   <APEX> + www 证书；两张分开管理，互不牵连。
    ssl_certificate     /etc/letsencrypt/live/wildcard.<APEX>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard.<APEX>/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 发布站跑的是用户生成的代码，禁止被任何站点 iframe 嵌套
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:5001;
        # ★ 上游 Flask 的 after_request 会给**所有**响应统一加主站那套头：
        #   `X-Frame-Options: SAMEORIGIN` + 面向主站 SPA 的 CORS 白名单。
        #   它们与本块冲突——实测响应里出现**两个同名 XFO**（SAMEORIGIN 在前、
        #   DENY 在后），浏览器取第一个，于是上面的 DENY 形同虚设；而 CORS
        #   那两行出现在独立 origin 的发布站上纯属语义错误。隐掉上游的，
        #   由本块自己的 add_header 统一决定。
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
