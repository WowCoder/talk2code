# Talk2Code 生产 Nginx 配置
# 放到 /etc/nginx/sites-enabled/talk2code 后执行: nginx -t && systemctl restart nginx
#
# 部署后务必再跑一次 certbot（见 docs/deploy.md 步骤 4.5）自动追加 443 SSL 块
# 并开启全站 HTTP→HTTPS 重定向，否则浏览器会把站点标为「不安全」。
server {
    listen 80;
    server_name your.domain.com;

    client_max_body_size 50m;

    # 前端静态产物
    location / {
        root /opt/talk2code/frontend-vue/dist;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API + SSE 长连接
    # 关键: proxy_buffering off + 长超时，否则 SSE 流式输出会被攒住、实时效果全无
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
