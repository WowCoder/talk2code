# Talk2Code 生产 Nginx 全局调优
# 安装: 复制到 /etc/nginx/conf.d/talk2code-tuning.conf 后 nginx -t && systemctl restart nginx
#
# 本文件是 http 上下文片段（conf.d/*.conf 被 nginx.conf 的 http 块 include），
# 所以只能放 http 级指令 —— server / location 级的东西在 sites-available/talk2code 里。

# ---- 静态文件句柄缓存 ----
# nginx 默认每个请求都要 stat() + open() 一次；本站一页要发十几个静态资源
# （构建产物 + 字体分片），部署后第一批请求还会命中冷页缓存。
# 开了之后路径解析结果与文件描述符会被复用，明显减少 syscall 与磁盘读取。
open_file_cache          max=4000 inactive=60s;
open_file_cache_valid    120s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

# ---- 访问日志带上耗时 ----
# 默认的 combined 格式**不含任何时间字段**，事后无法回答「这次到底是服务端慢
# 还是用户网络慢」—— 排查首屏慢时只能靠猜。加上 $request_time（nginx 视角的
# 完整耗时）与 $upstream_response_time（后端耗时）后，一次 grep 就能定位。
#
# 排查用法：按耗时倒序看最慢的请求
#   awk -F'rt=' '/rt=/{split($2,a," "); print a[1], $0}' access.log | sort -rn | head
log_format talk2code_timed
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
