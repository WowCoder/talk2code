# Talk2Code 宣传主页（静态站）Nginx 配置
# 用法:  把下面的 <SERVER_IP> / <APEX> / <APEX_WWW> 换成实际值，然后
#        sudo cp deploy/nginx-landing.conf /etc/nginx/sites-enabled/landing
#        sudo nginx -t && sudo systemctl restart nginx
#
# 阶段一（备案期间）: server_name 只留 IP，用 http://<SERVER_IP> 访问
# 阶段二（备案通过）: 加上 <APEX> / <APEX_WWW>，再跑 certbot 上 HTTPS
#
# 注意: 未备案域名解析到大陆服务器会被云厂商拦截并跳转备案提示页，
#       与 Nginx 配置无关；备案通过前请只用 IP 访问。

server {
    listen 80 default_server;
    # 备案期间只写 IP；备案通过后改成: <APEX> <APEX_WWW>;
    server_name <SERVER_IP>;

    root /var/www/talk2code-site;
    index index.html;

    # 单页静态站，未知路径回落到首页（避免 404 裸页面）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（视频/图片/svg 文件名不变，可放心缓存）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML 不缓存，方便改完立刻看到
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # gzip：HTML/CSS/JS/SVG 压缩，视频本身已压缩不处理
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 视频支持拖动（Range 请求）
    location ~* \.mp4$ {
        expires 7d;
        add_header Accept-Ranges bytes;
    }

    access_log /var/log/nginx/talk2code-landing.access.log;
    error_log  /var/log/nginx/talk2code-landing.error.log;
}

