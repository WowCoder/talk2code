[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not slow"
markers =
    unit: 单元测试 (快速，无外部依赖)
    integration: 集成测试 (可能需要数据库/外部服务)
    slow: 慢速测试 -- 需要真实 LLM API 调用，默认跳过
    e2e: 端到端测试 -- 需要 LLM + Playwright，手动运行
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
timeout = 60
timeout_method = signal
